<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Professional HTML Forms</title>



</head>

<body>

<nav>

    <h2>HTML Demo</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>

<div class="hero">

    <h1>HTML Form Elements Demo</h1>

    <p>Learn most commonly used HTML input controls.</p>

</div>

<div class="container">

<h2>Registration Form</h2>

<form>

<div class="row">

<div class="col">

<label>Full Name</label>
<input type="text" placeholder="Enter Name">

</div>

<div class="col">

<label>Email</label>
<input type="email" placeholder="abc@gmail.com">

</div>

</div>

<div class="row">

<div class="col">

<label>Phone Number</label>
<input type="tel">

</div>

<div class="col">

<label>Age</label>
<input type="number" min="1" max="100">

</div>

</div>

<label>Password</label>
<input type="password">

<label>Date of Birth</label>
<input type="date">

<label>Favorite Color</label>
<input type="color">

<label>Upload Resume</label>
<input type="file">

<label>Website</label>
<input type="url">

<label>Experience (Years)</label>
<input type="range" min="0" max="20">

<label>Gender</label>

<div class="radio-group">

<label><input type="radio" name="gender"> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

<label>Skills</label>

<div class="check-group">

<label><input type="checkbox"> HTML</label>

<label><input type="checkbox"> CSS</label>

<label><input type="checkbox"> JavaScript</label>

<label><input type="checkbox"> Python</label>

<label><input type="checkbox"> Java</label>

</div>

<label>Country</label>

<select>

<option>India</option>
<option>USA</option>
<option>Germany</option>
<option>Australia</option>
<option>Japan</option>

</select>

<label>Address</label>

<textarea rows="4"></textarea>

<button>Register</button>

</form>

</div>

<footer>

HTML & CSS Demo Website

</footer>

</body>

</html>
