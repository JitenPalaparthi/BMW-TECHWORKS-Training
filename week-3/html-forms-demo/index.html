<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Professional HTML Forms</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#eef2f7;
        }

        nav{
            background:#1e3a8a;
            color:white;
            padding:18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .hero{
            text-align:center;
            padding:50px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
        }

        .hero h1{
            font-size:42px;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

        h2{
            margin-bottom:20px;
            color:#1e3a8a;
        }

        .row{
            display:flex;
            gap:20px;
        }

        .col{
            flex:1;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:15px;
        }

        textarea{
            resize:vertical;
        }

        .radio-group,
        .check-group{
            margin-top:10px;
        }

        .radio-group label,
        .check-group label{
            display:inline-block;
            font-weight:normal;
            margin-right:20px;
        }

        button{
            margin-top:25px;
            background:#2563eb;
            color:white;
            border:none;
            padding:15px 30px;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        footer{
            text-align:center;
            margin:40px;
            color:#666;
        }

    </style>

</head>

<body>

<nav>

    <h2>HTML Demo</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>

<div class="hero">

    <h1>HTML Form Elements Demo</h1>

    <p>Learn most commonly used HTML input controls.</p>

</div>

<div class="container">

<h2>Registration Form</h2>

<form>

<div class="row">

<div class="col">

<label>Full Name</label>
<input type="text" placeholder="Enter Name">

</div>

<div class="col">

<label>Email</label>
<input type="email" placeholder="abc@gmail.com">

</div>

</div>

<div class="row">

<div class="col">

<label>Phone Number</label>
<input type="tel">

</div>

<div class="col">

<label>Age</label>
<input type="number" min="1" max="100">

</div>

</div>

<label>Password</label>
<input type="password">

<label>Date of Birth</label>
<input type="date">

<label>Favorite Color</label>
<input type="color">

<label>Upload Resume</label>
<input type="file">

<label>Website</label>
<input type="url">

<label>Experience (Years)</label>
<input type="range" min="0" max="20">

<label>Gender</label>

<div class="radio-group">

<label><input type="radio" name="gender"> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

<label>Skills</label>

<div class="check-group">

<label><input type="checkbox"> HTML</label>

<label><input type="checkbox"> CSS</label>

<label><input type="checkbox"> JavaScript</label>

<label><input type="checkbox"> Python</label>

<label><input type="checkbox"> Java</label>

</div>

<label>Country</label>

<select>

<option>India</option>
<option>USA</option>
<option>Germany</option>
<option>Australia</option>
<option>Japan</option>

</select>

<label>Address</label>

<textarea rows="4"></textarea>

<button>Register</button>

</form>

</div>

<footer>

HTML & CSS Demo Website

</footer>

</body>

</html>
