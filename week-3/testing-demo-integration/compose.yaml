services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testingdb
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testing -d testingdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/testingdb
      DB_USERNAME: testing
      DB_PASSWORD: testing
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
