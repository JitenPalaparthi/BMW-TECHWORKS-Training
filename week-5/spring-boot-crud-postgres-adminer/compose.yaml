services:
  postgres:
    image: postgres:17-alpine
    container_name: crud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cruddb}
      POSTGRES_USER: ${POSTGRES_USER:-cruduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crudpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cruduser} -d ${POSTGRES_DB:-cruddb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cruddb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cruduser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-crudpassword}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  adminer:
    image: adminer:5
    container_name: crud-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"

volumes:
  postgres_data:
