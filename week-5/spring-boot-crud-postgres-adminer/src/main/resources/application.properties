spring.application.name=spring-boot-crud-postgres-adminer
server.port=${SERVER_PORT:8080}

# Values can be overridden through environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cruddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cruduser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:crudpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Return clear validation/error messages without exposing stack traces.
server.error.include-message=never
server.error.include-stacktrace=never
