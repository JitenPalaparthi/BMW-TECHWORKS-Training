apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: java-demo
  labels:
    app: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
      - name: adminer
        image: adminer:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: adminer-service
  namespace: java-demo
spec:
  type: LoadBalancer
  selector:
    app: adminer
  ports:
  - port: 8081
    targetPort: 8080