apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-demo-stable
  namespace: java-demo
  labels:
    app: java-demo-canary
    track: stable
  annotations:
    kubernetes.io/change-cause: "Stable release v0.0.2"
spec:
  replicas: 4
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: java-demo-canary
      track: stable
  template:
    metadata:
      labels:
        app: java-demo-canary
        track: stable
    spec:
      containers:
      - name: java-demo
        image: jpalaparthi/bmw-k8s-java-demo:v0.0.2
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
