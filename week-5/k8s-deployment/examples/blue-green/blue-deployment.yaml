apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-demo-blue
  namespace: java-demo
  labels:
    app: java-demo-app
    version: blue
  annotations:
    kubernetes.io/change-cause: "Blue environment running v0.0.2"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: java-demo-app
      version: blue
  template:
    metadata:
      labels:
        app: java-demo-app
        version: blue
    spec:
      containers:
      - name: java-demo
        image: jpalaparthi/bmw-k8s-java-demo:v0.0.2
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
