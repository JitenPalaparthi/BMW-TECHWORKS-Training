apiVersion: v1
kind: Pod
metadata:
  name: openebs-demo
spec:
  containers:
    - name: ubuntu
      image: ubuntu:24.04

      command:
        - /bin/bash
        - -c
        - |
          echo "Hello from OpenEBS" > /data/message.txt
          sleep infinity

      volumeMounts:
        - name: storage
          mountPath: /data

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: openebs-demo-pvc