apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging

data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki

      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules

      replication_factor: 1

      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      discover_log_levels: true
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_parallelism: 32

    pattern_ingester:
      enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

      rule_path: /loki/rules-temp
      alertmanager_url: http://localhost:9093

    compactor:
      working_directory: /loki/compactor
      retention_enabled: false

    analytics:
      reporting_enabled: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki

          image: grafana/loki:latest

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - name: http
              containerPort: 3100

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: storage
              mountPath: /loki

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
  labels:
    app: loki

spec:
  type: ClusterIP

  selector:
    app: loki

  ports:
    - name: http
      port: 3100
      targetPort: 3100