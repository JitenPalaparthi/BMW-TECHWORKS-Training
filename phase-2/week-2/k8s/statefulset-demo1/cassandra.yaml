apiVersion: v1
kind: Namespace
metadata:
  name: stateful-demo

---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-headless
  namespace: stateful-demo
  labels:
    app: cassandra
spec:
  clusterIP: None
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: stateful-demo
spec:
  serviceName: cassandra-headless
  replicas: 3

  selector:
    matchLabels:
      app: cassandra

  template:
    metadata:
      labels:
        app: cassandra

    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1

          ports:
            - name: cql
              containerPort: 9042

          env:
            - name: MAX_HEAP_SIZE
              value: "512M"

            - name: HEAP_NEWSIZE
              value: "100M"

          resources:
            requests:
              memory: "600Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"

          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra

      volumes:
        - name: cassandra-data
          emptyDir: {}