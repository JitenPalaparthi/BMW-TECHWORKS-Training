apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-charts.fullname" . }}
  labels:
    {{- include "demo-charts.labels" . | nindent 4 }}
    namespace: {{.Values.namespace}}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "demo-charts.selectorLabels" . | nindent 4 }}
