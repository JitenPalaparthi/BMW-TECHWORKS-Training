apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: {{ .Values.global.namespace }}
  
spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ .Release.Name }}-frontend

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 5000
      nodePort: {{ .Values.service.nodePort }}