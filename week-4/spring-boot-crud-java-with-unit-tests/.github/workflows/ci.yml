name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.*' 
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Insall Java21 and mvn
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin' # Matches your local Eclipse Adoptium setup
        cache: 'maven'    
    - name: Package Jar file
      run: |
        mvn clean package -DskipTests
        pwd
        ls -la

    - name: Login to docker 
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GitHub Container Registry (GHCR)
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Images
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Extract the tag name (e.g., v0.0.1) from the git reference
        TAG_NAME=${GITHUB_REF#refs/tags/}
        
        # 1. Build and Tag for Docker Hub
        docker build . -t jpalaparthi/sp-crud-demo:${TAG_NAME} -t jpalaparthi/sp-crud-demo:latest
        
        # 2. Tag the same image for GHCR (Must include ghcr.io/ owner prefix in lowercase)
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker tag jpalaparthi/sp-crud-demo:${TAG_NAME} ghcr.io/${OWNER_LOWER}/sp-crud-demo:${TAG_NAME}
        docker tag jpalaparthi/sp-crud-demo:${TAG_NAME} ghcr.io/${OWNER_LOWER}/sp-crud-demo:latest
        
        # 3. Push everything to Docker Hub
        docker push jpalaparthi/sp-crud-demo:${TAG_NAME}
        docker push jpalaparthi/sp-crud-demo:latest
        
        # # 4. Push everything to GHCR
        docker push ghcr.io/${OWNER_LOWER}/sp-crud-demo:${TAG_NAME}
        docker push ghcr.io/${OWNER_LOWER}/sp-crud-demo:latest


    #     /home/runner/work/bwm-spring-boot-demo-app/bwm-spring-boot-demo-app/
    #     target/spring-boot-crud-0.0.1-SNAPSHOT.jar